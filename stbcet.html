<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Shree Tuljabhawani College Of Engineering, Tuljapur</h1>
    <h2>Data Collection Of Hostel Student Data</h2>
    <form action="/stbcet" method="post">
        Student Name: <input type="text">  &nbsp;&nbsp;&nbsp; Admission year: <input type="number"> <br>
      
     <br>
       University PRN: <input type="text+number"> &nbsp;&nbsp;&nbsp;Cap allotment: <select name="text"> <option>yes</option> <option>No</option></select>    <br>

     <br>
        Student Email: <input type="text"> &nbsp;&nbsp;&nbsp; Mobile number: <input type="number"> <br>   
     <br> 
       
        Student State: <input type="text" list="statelist">
         <datalist id="statelist">
            <option value='mh'>Maharashtra</option>
            <option>Gujarat</option>
            <option>Odisha</option>
            <option>Tamilnadu</option>
            <option>Karnataka</option>
         </datalist>
         &nbsp;&nbsp;&nbsp;
      Birth Date: <input type="date" >
     <br>
     <br>
        Gender :<input type="radio" name="Gender" value="male"> male
        <input type="radio" name="Gender" value="female"> female
        <input type="radio" name="Gender" value="Other"> Other <br>
     <br>
        Branch :<input type="radio" name="Branch" value="COMPUTER"> COMPUTER
        <input type="radio" name=" Branch" value="ELECTRICAL"> ELECTRICAL
        <input type="radio" name="Branch" value="CIVIL"> CIVIL
        <input type="radio" name="Branch" value="MECH">  MECH <br>

     <br>

         <button>
            submit
         </button>

    </form >
</body>
</html>
