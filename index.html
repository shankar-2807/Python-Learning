<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Colored Square Detector</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    margin: 0; /* remove default margin */
    height: 100vh; /* full screen height */
    display: flex; /* enable flexbox */
    flex-direction: column; /* stack elements vertically */
    justify-content: center; /* center vertically */
    align-items: center; /* center horizontally */
    background-color: yellowgreen; /* optional background */
  }
  #canvas {
    margin-top: 20px;
    border: 1px solid #ccc;
  }
    #preview {
      max-width: 640px;
      max-height: 480px;
      border: 1px solid black;
    }
    #canvas {
      position: relative;
      display: block;
      margin-top: 10px;
    }
    .overlay {
      position: absolute;
      left:0;
      top:0;
    }
  </style>
</head>
<body>
  <h2>Colored Square Detector (Demo)</h2>
  <p>Upload an image created by the notebook (or any image with a single red/green/blue square).</p>
  <input type="file" id="file" accept="image/*"><br>
  <button id="predict">Detect</button>
  <div style="position:relative;">
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>
  <pre id="result"></pre>

<script>
const fileInput = document.getElementById('file');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();

fileInput.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  img.onload = () => {
    // fit image to canvas
    const scale = Math.min(canvas.width/img.width, canvas.height/img.height);
    const w = img.width*scale, h = img.height*scale;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, w, h);
  };
  img.src = url;
});

document.getElementById('predict').addEventListener('click', async ()=>{
  if(!img.src){ alert('Choose an image first'); return; }
  // convert canvas image to blob
  const dataUrl = canvas.toDataURL('image/png');
  const res = await fetch('/predict', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({image: dataUrl})
  });
  const json = await res.json();
  document.getElementById('result').textContent = JSON.stringify(json, null, 2);
  // draw bbox
  if(json.bbox){
    const [x,y,w,h] = json.bbox;
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = 'black';
    ctx.font = '18px Arial';
    ctx.fillText(json.class + ' (' + (json.score||'') + ')', x, Math.max(20, y-6));
  }
});
</script>
</body>
</html>
